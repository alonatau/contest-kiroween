<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="Raise a ghost pet inside a haunted LCD egg. Feed it fears, keep its candle lit, and don't let it haunt your screen. Your 1997 Tamagotchi is back, and it remembers.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ghostagotchi">
  <meta property="og:description" content="Raise a ghost pet inside a haunted LCD egg. Feed it fears, keep its candle lit, and don't let it haunt your screen.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%208%208%22%20shape-rendering=%22crispEdges%22%3E%3Crect%20width=%228%22%20height=%228%22%20fill=%22%230a160a%22/%3E%3Cpath%20fill=%22%238fd86a%22%20d=%22M2%200h4v1h-4zM1%201h6v1h-6zM0%202h8v1h-8zM0%203h2v1h-2zM3%203h2v1h-2zM6%203h2v1h-2zM0%204h8v1h-8zM0%205h8v1h-8zM1%206h2v1h-2zM4%206h2v1h-2zM7%206h1v1h-1zM1%207h1v1h-1zM4%207h1v1h-1zM7%207h1v1h-1z%22/%3E%3C/svg%3E">
  <title>Ghostagotchi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="room" class="room">
    <!-- Haunt overlay: dims the room -->
    <div id="haunt-dim" class="haunt-dim" aria-hidden="true"></div>
    <div id="glitch-crawl" class="glitch-crawl" aria-hidden="true"></div>

    <div id="egg" class="egg">
      <div class="egg-shell">
        <div class="egg-scratch s1"></div>
        <div class="egg-scratch s2"></div>
        <div class="egg-scratch s3"></div>
        <div class="egg-crack"></div>
        <div class="egg-sticker"><span>GHOSTAGOTCHI</span><span class="sticker-year">1997</span></div>

        <div class="lcd-bezel">
          <canvas id="lcd" width="32" height="16"></canvas>
          <div class="lcd-scanlines" aria-hidden="true"></div>
          <div class="lcd-glass" aria-hidden="true"></div>
        </div>
      </div>

      <div class="buttons">
        <button id="btnA" class="btn" type="button" aria-label="Button A">
          <span class="btn-cap"></span>
          <span class="btn-letter">A</span>
        </button>
        <button id="btnB" class="btn" type="button" aria-label="Button B">
          <span class="btn-cap"></span>
          <span class="btn-letter">B</span>
        </button>
        <button id="btnC" class="btn" type="button" aria-label="Button C">
          <span class="btn-cap"></span>
          <span class="btn-letter">C</span>
        </button>
      </div>
    </div>

    <div id="hint" class="hint" aria-hidden="true">
      <span>A: next</span><span>B: select</span><span>C: back</span>
    </div>

    <button id="mute" class="mute" type="button" aria-label="Toggle sound">
      <span class="mute-led" id="mute-led"></span>
      <span class="mute-label" id="mute-label">SOUND</span>
    </button>

    <a id="share" class="share" hidden href="#" title="Copy a link to your ghost">SHARE MY GHOST</a>

    <div id="share-box" class="share-box" hidden>
      <span class="share-box-label">COPY THIS LINK</span>
      <div class="share-box-row">
        <input id="share-link" class="share-link" type="text" readonly aria-label="Share link" spellcheck="false">
        <button id="share-close" class="share-close" type="button" aria-label="Close">x</button>
      </div>
    </div>
  </div>

  <!-- Read-only share card, shown when opened via ?ghost=NAME&stage=STAGE -->
  <div class="card" id="card" aria-hidden="true">
    <div class="card-inner">
      <canvas id="card-canvas" width="128" height="64"></canvas>
      <div class="card-name" id="card-name">NAME</div>
      <div class="card-stage" id="card-stage">STAGE</div>
      <div class="card-note">A Ghostagotchi from 1997. It still remembers.</div>
      <a href="./">raise your own &rarr;</a>
    </div>
  </div>

  <!-- Scripts loaded in dependency order; classic scripts share top-level scope. -->
  <script src="js/font.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/lcd.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/state.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
